[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness"
version = "0.7.2"
description = "Agent Harness — 智能体运行时外壳，支持 ReAct 循环、工具系统、分级记忆、安全控制与可观测性"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.23",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "chromadb>=1.5",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
cn = ["jieba>=0.42"]  # 可选：更精准的中文分词（未安装时自动使用内置分词器）
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
harness = "harness.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
]

[tool.coverage.run]
source = ["src"]
