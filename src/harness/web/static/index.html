<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Harness · Agent 控制台</title>

<style>

:root,[data-theme=dark]{--bg:#0a0a0b;--bg2:#141416;--bg3:#1d1d21;--line:#2a2a30;

  --tx:#ededf0;--tx2:#a1a1aa;--tx3:#71717a;--ok:#4ade80;--err:#f87171}

[data-theme=light]{--bg:#fafafa;--bg2:#fff;--bg3:#f1f1f3;--line:#e4e4e7;

  --tx:#17171a;--tx2:#55555c;--tx3:#9b9ba3}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body{font-family:Inter,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;

  background:var(--bg);color:var(--tx);overflow:hidden;font-size:15px}

button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}

:focus-visible{outline:2px solid var(--tx);outline-offset:2px;border-radius:6px}

::-webkit-scrollbar{width:8px;height:8px}

::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:8px}



#app{display:flex;height:100vh;height:100dvh}



.side{width:250px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);

  display:flex;flex-direction:column;z-index:40}

.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}

.logo{width:32px;height:32px;border-radius:9px;background:var(--tx);color:var(--bg);

  display:grid;place-items:center;font-weight:800}

.brand h1{font-size:14px}.brand span{display:block;font-size:11px;color:var(--tx3)}

.newbtn{margin:6px 12px 8px;padding:10px;border-radius:10px;background:var(--tx);color:var(--bg);

  font-size:13px;font-weight:600;text-align:center;transition:opacity .15s}

.newbtn:hover{opacity:.85}

.slabel{padding:10px 18px 4px;font-size:10px;letter-spacing:1.2px;color:var(--tx3);text-transform:uppercase}

.slist{flex:1;overflow-y:auto;padding:0 8px 8px}

.sitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;

  color:var(--tx2);font-size:13px;border:1px solid transparent;margin-bottom:2px}

.sitem:hover,.sitem.on{background:var(--bg3);color:var(--tx)}

.sitem.on{border-color:var(--line)}

.sitem svg{flex-shrink:0;opacity:.6}

.stitle{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.sact{display:none;gap:2px}
.selc{display:none;flex-shrink:0;accent-color:var(--tx);width:14px;height:14px}
.side.bulk .selc{display:inline-block}
.side.bulk .sact{display:none!important}
.slabel{display:flex;align-items:center;justify-content:space-between}
.ops{display:flex;gap:6px}
.ops button{font-size:10.5px;color:var(--tx3);padding:2px 7px;border-radius:6px;border:1px solid transparent}
.ops button:hover{color:var(--tx);border-color:var(--line)}
.ops button.on{color:var(--tx);border-color:var(--tx3)}

.sitem:hover .sact,.side.bulk .sitem:hover .sact{display:flex}
.side.bulk .sact{display:none!important}
.selc{flex-shrink:0;accent-color:var(--tx);width:14px;height:14px}
.side:not(.bulk) .selc{display:none}
.slabel{display:flex;align-items:center;justify-content:space-between}
.ops{display:flex;gap:6px}
.ops button{font-size:10.5px;color:var(--tx3);padding:2px 7px;border-radius:6px;border:1px solid transparent}
.ops button:hover{color:var(--tx);border-color:var(--line)}
.ops button.on{color:var(--tx);border-color:var(--tx3)}

.ibtn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--tx3)}

.ibtn:hover{background:var(--bg);color:var(--tx)}

.ibtn.del:hover{color:var(--err)}

.sfoot{padding:11px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--tx3);

  display:flex;justify-content:space-between;align-items:center}

.dot{width:7px;height:7px;border-radius:50%;background:var(--err);display:inline-block;margin-right:5px}

.dot.on{background:var(--ok)}



.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;gap:8px;padding:12px clamp(12px,3vw,20px);

  border-bottom:1px solid var(--line);background:var(--bg2)}

.menu{display:none}

.ttl{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tag{font-size:10px;padding:3px 8px;border-radius:99px;background:var(--bg3);color:var(--tx2);flex-shrink:0}

.spacer{flex:1}

.tbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;

  background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--tx2);white-space:nowrap}

.tbtn:hover{color:var(--tx);border-color:var(--tx3)}



.chat{flex:1;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:auto;scrollbar-gutter:stable}

.inner{max-width:760px;margin:0 auto;padding:20px clamp(12px,4vw,22px) 12px;

  display:flex;flex-direction:column;gap:16px}



.hero{text-align:center;padding:9vh 8px 16px}

.hglyph{width:58px;height:58px;margin:0 auto 16px;border-radius:16px;background:var(--tx);color:var(--bg);

  display:grid;place-items:center}

.hero h2{font-size:clamp(19px,3vw,23px)}

.hero p{color:var(--tx2);font-size:13px;margin-top:6px}

.samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px;max-width:600px;margin:22px auto 0}

.sample{padding:13px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);

  text-align:left;font-size:12px;line-height:1.5;transition:border-color .15s}

.sample:hover{border-color:var(--tx3)}

.sample b{display:block;font-size:12.5px;margin-bottom:4px}

.sample span{color:var(--tx3)}



.msg{display:flex;flex-direction:column;animation:up .25s ease}

.msg.u{align-items:flex-end}

.mhead{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--tx3);margin-bottom:5px;padding:0 4px}

.msg.u .mhead{flex-direction:row-reverse}

.av{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700}

.av.ai{background:var(--tx);color:var(--bg)}.av.hu{background:var(--bg3);color:var(--tx)}

.bub{max-width:88%;padding:12px 15px;font-size:14px;line-height:1.75;border-radius:13px;word-break:break-word}

.msg.u .bub{background:var(--bg3);border:1px solid var(--line);border-bottom-right-radius:5px}

.msg.a .bub{background:var(--bg2);border:1px solid var(--line);width:100%;max-width:100%;border-bottom-left-radius:5px}

.bub p{margin:0 0 8px}.bub p:last-child{margin:0}

.bub ul,.bub ol{margin:4px 0 8px 20px}

.bub h3{font-size:14px;margin:8px 0 5px}

.bub code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--bg3);padding:1px 6px;border-radius:5px}

.bub pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;overflow-x:auto;margin:7px 0}

.meta{margin-top:9px;padding-top:7px;border-top:1px dashed var(--line);display:flex;gap:12px;font-size:10.5px;color:var(--tx3)}

.cur{display:inline-block;width:0;border-left:7px solid var(--tx);margin-right:-7px;vertical-align:-2px;animation:blink 1s steps(2) infinite}

@keyframes blink{50%{opacity:0}}

@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1}}



.wmchip{align-self:flex-start;padding:7px 12px;border-radius:10px;background:var(--bg3);

  border:1px solid var(--line);font-size:11.5px;color:var(--tx2)}



.trace{margin-bottom:10px}

.tglb{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;

  background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--tx2)}

.tglb:hover{color:var(--tx)}

.spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--tx3);border-top-color:var(--tx);

  display:inline-block;animation:rot .8s linear infinite}

@keyframes rot{to{transform:rotate(360deg)}}

.steps{display:none;flex-direction:column;gap:7px;margin-top:9px}

.steps.show{display:flex}

.step{background:var(--bg2);border:1px solid var(--line);border-radius:11px;overflow:hidden}

.sbar{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px}

.sbar:hover{background:var(--bg3)}

.kind{font-size:9.5px;font-weight:800;letter-spacing:.8px;padding:2px 7px;border-radius:5px;

  border:1px solid var(--line);color:var(--tx2);flex-shrink:0}

.summ{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);min-width:0}

.chev{color:var(--tx3);transition:transform .2s}

.step.open .chev{transform:rotate(90deg)}

.sbody{display:none;padding:2px 12px 11px 39px;border-top:1px dashed var(--line);

  font-size:12px;line-height:1.65;color:var(--tx2)}

.step.open .sbody{display:block}

.sbody b{display:block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin:7px 0 3px}

.sbody pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;

  font-size:11.5px;max-height:240px;overflow-y:auto}



.compzone{padding:8px clamp(12px,4vw,22px) calc(14px + env(safe-area-inset-bottom))}

.comp{max-width:760px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);

  border-radius:18px;padding:11px 11px 8px 16px;transition:border-color .2s}

.comp:focus-within{border-color:var(--tx3)}

.comp textarea{width:100%;background:none;border:none;resize:none;font-size:14px;line-height:1.6;

  max-height:150px;min-height:24px;outline:none;color:var(--tx)}

.cfoot{display:flex;align-items:center;gap:10px;padding:5px 4px 0}

.hint{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cnt{font-size:11px;color:var(--tx3);margin-left:auto}

.send{width:36px;height:36px;border-radius:12px;background:var(--tx);color:var(--bg);

  display:grid;place-items:center;flex-shrink:0;transition:transform .15s,opacity .15s}

.send:hover:not(:disabled){transform:scale(1.05)}

.send:disabled{opacity:.35;cursor:not-allowed}

.send.stop{background:var(--err);color:#fff}



.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;opacity:0;pointer-events:none;transition:.25s}

.mask.show{opacity:1;pointer-events:auto}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--bg2);

  border-left:1px solid var(--line);z-index:50;transform:translateX(105%);

  transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}

.drawer.open{transform:none}

.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}

.dhead h3{font-size:14px}

.dbody{flex:1;overflow-y:auto;padding:0 14px 16px}

.tabs{display:flex;gap:6px;padding:0 14px 10px}

.tab{flex:1;padding:8px;border-radius:9px;background:var(--bg3);font-size:12px;color:var(--tx2)}

.tab.on{background:var(--tx);color:var(--bg);font-weight:600}

.card{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}

.card b{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

.card p{font-size:11.8px;color:var(--tx2);margin-top:3px;line-height:1.5}

.statg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}

.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px}

.stat .v{font-size:19px;font-weight:750}

.stat .k{font-size:10.5px;color:var(--tx3);margin-top:2px}

.bar{margin-bottom:9px}

.bl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx2);margin-bottom:4px}

.bt{height:6px;border-radius:6px;background:var(--bg3)}

.bf{height:100%;border-radius:6px;background:var(--tx3)}

.sub{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin:14px 0 8px}

.fld{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);

  background:var(--bg);color:var(--tx);font-size:12.5px;margin-bottom:7px}

.note{color:var(--tx3);font-size:10.5px;margin:-4px 0 8px}

.row2{display:flex;gap:7px}.row2>*{flex:1;min-width:0}

.pill{float:right;font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--tx2)}

.abtn{padding:7px 12px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);

  font-size:12px;color:var(--tx2)}

.abtn:hover{color:var(--tx);border-color:var(--tx3)}

.abtn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}

.abtn.warn:hover{color:var(--err);border-color:var(--err)}

.trace-mini{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin-bottom:8px;font-size:11.5px;color:var(--tx2)}

.trace-mini b{color:var(--tx);font-family:ui-monospace,monospace;font-size:11px}



.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;

  display:flex;flex-direction:column;gap:7px;align-items:center}

.toast{padding:9px 17px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);

  font-size:12.5px;animation:up .25s}

.toast.err{border-color:var(--err);color:var(--err)}

.toast.ok{border-color:var(--ok);color:var(--ok)}



.menu{display:none}

@media(max-width:880px){

  .side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-102%);

    box-shadow:0 0 40px rgba(0,0,0,.5)}

  .side.openm{transform:none}

  .menu{display:grid}

  .tbtn span{display:none}.tbtn{padding:8px}

}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.bub blockquote{border-left:3px solid var(--tx3);margin:8px 0;padding:6px 12px;color:var(--tx2)}
.bub table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
.bub th,.bub td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.bub th{background:var(--bg3);font-weight:600}
.bub hr{border:none;border-top:1px dashed var(--line);margin:10px 0}

</style>

</head>

<body>

<div id="app">

  <aside class="side" id="side">

    <div class="brand"><div class="logo">H</div><div><h1>Harness</h1><span>Agent 控制台</span></div></div>

    <button class="newbtn" id="newBtn">＋ 新对话</button>

    <div class="slabel"><span style="letter-spacing:1.2px">历史会话</span><span class="ops">
          <button id="bulkBtn">多选</button><button id="selAllBtn" title="全选当前列表">全选</button></span></div>

    <div id="batchBar" style="display:none;padding:6px 14px;font-size:11.5px;color:var(--tx2);align-items:center;gap:8px;border-bottom:1px solid var(--line)">

      <span id="selCnt"></span>

      <button class="abtn warn" id="selDel" style="padding:4px 10px">删除所选</button>

      <button class="abtn" id="selNone" style="padding:4px 10px">取消</button>

    </div>

    <div class="slist" id="slist"></div>

    <div class="sfoot"><span><span class="dot" id="dot"></span><span id="stxt">连接中</span></span><span id="ver2"></span></div>

  </aside>



  <main class="main">

    <header class="topbar">

      <button class="ibtn menu" id="menuBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

      <div class="ttl" id="ttl">新对话</div>

      <span class="tag" id="badge">Agent</span>

      <div class="spacer"></div>

      <button class="ibtn" id="themeBtn" title="切换黑白主题" style="border:1px solid var(--line);border-radius:99px;width:32px;height:32px">◑</button>

      <button class="tbtn" id="clrBtn" title="清空当前会话记录"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m3 0v14H5V6"/></svg><span>清空</span></button>

      <button class="tbtn" id="mBtn"><span>指标</span></button>

      <button class="tbtn" id="tBtn"><span>工具</span></button>

      <button class="tbtn" id="aBtn"><span>管理</span></button>

    </header>



    <div class="chat" id="chatScroll"><div class="inner" id="inner"></div></div>



    <div class="compzone">

      <div class="comp">

        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 · Shift+Enter 换行" maxlength="4096"></textarea>

        <div class="cfoot">

          <span class="hint" id="hint"></span><span class="cnt" id="cnt"></span>

          <button class="send" id="sendB" disabled>

            <svg id="sIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>

          </button>

        </div>

      </div>

    </div>

  </main>



  <div class="mask" id="mask"></div>

  <aside class="drawer" id="drawer">

    <div style="display:flex;flex-direction:column;height:100%">

      <div class="dhead"><h3 id="dT">面板</h3>

        <button class="ibtn" id="dClose">✕</button></div>

      <div class="dbody" id="dB"></div>

    </div>

  </aside>

</div>

<div class="toasts" id="toasts"></div>



<script>

"use strict";

const $=i=>document.getElementById(i);

const inner=$("inner"),scroller=$("chatScroll"),input=$("input"),sendB=$("sendB");

let sessionId=localStorage.getItem("h_sid")||null,isStreaming=false,ctrl=null,pending=[],stick=true;



let uid=localStorage.getItem("h_uid")||"";

if(!uid){uid="u_"+Math.random().toString(36).slice(2,10);localStorage.setItem("h_uid",uid);}

const xuid=h=>Object.assign({"X-User-Id":uid},h||{});

const admTk=()=>localStorage.getItem("h_adm_tk")||"demo-admin-token";

const admH=x=>Object.assign({"X-Admin-Token":admTk()},x||{});



/* ── 工具 ── */

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

const nowT=()=>new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});

function toast(m,t){const e=document.createElement("div");e.className="toast "+t;e.textContent=m;

  $("toasts").appendChild(e);setTimeout(()=>{e.style.opacity=0;e.style.transition="opacity .4s";setTimeout(()=>e.remove(),400)},3000);}

function nearBottom(){return scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<80;}

let _dp=false;
function down(f){if(!(f||stick)||_dp)return;_dp=true;requestAnimationFrame(()=>{_dp=false;scroller.scrollTop=scroller.scrollHeight})}

scroller.addEventListener("scroll",()=>{stick=nearBottom();});



function md(t){
  // Phase 1: 提取代码块占位（防止内部被格式化）
  const codeBlocks=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)(?:```|$)/g,(_,lang,code)=>{
    codeBlocks.push({lang,code});
    return `\x00CB${codeBlocks.length-1}\x00`;
  });

  // Phase 2: 安全转义
  t=esc(t);

  // Phase 3: 行级解析 → 块级 HTML
  const lines=t.split("\n");
  let html="",listType=null,inQuote=false,inTable=false,tableRows=[];

  const closeList=()=>{if(listType){html+=listType==="ul"?"</ul>":"</ol>";listType=null}};
  const closeQuote=()=>{if(inQuote){html+="</blockquote>";inQuote=false}};
  const flushTable=()=>{
    if(!inTable)return;
    if(tableRows.length>=2){
      html+="<table><thead><tr>";
      tableRows[0].forEach(c=>html+=`<th>${c}</th>`);html+="</tr></thead><tbody>";
      for(let r=1;r<tableRows.length;r++){
        html+="<tr>";tableRows[r].forEach(c=>html+=`<td>${c}</td>`);html+="</tr>";
      }
      html+="</tbody></table>";
    }else if(tableRows.length===1){
      html+="<p>"+tableRows[0].map(c=>`<b>${c}</b>`).join(" | ")+"</p>";
    }
    tableRows=[];inTable=false;
  };
  const openQuote=()=>{closeL();flushTable();if(!inQuote){html+="<blockquote>";inQuote=true}};

  function closeL(){if(listType){html+=listType==="ul"?"</ul>":"</ol>";listType=null}}

  for(let li=0;li<lines.length;li++){
    let line=lines[li];

    // 表格行
    if(/^\s*\|.*\|\s*$/.test(line)){
      const cells=line.split("|").slice(1,-1).map(c=>inline(c.trim()));
      // 分隔行跳过
      if(/^[\s|:\-]+$/.test(line)){continue}
      if(!inTable){inTable=true;tableRows=[]}
      tableRows.push(cells);
      continue;
    }
    flushTable();

    // 水平线
    if(/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)){closeL();closeQuote();html+="<hr>";continue}

    // 空行
    if(!line.trim()){closeL();closeQuote();continue}

    // 引用
    if(line.startsWith("> ")||line===">"){
      openQuote();
      html+=inline(line.replace(/^>\s?/,""))+"<br/>";
      continue;
    }
    closeQuote();

    // 无序列表
    let m=line.match(/^(\s*)[-*•]\s+(.*)/);
    if(m){
      if(listType!=="ul"){closeL();flushTable();html+="<ul>";listType="ul"}
      html+=`<li>${inline(m[2])}</li>`;continue;
    }

    // 有序列表
    m=line.match(/^(\s*)(\d+[.)])\s+(.*)/);
    if(m){
      if(listType!=="ol"){closeL();flushTable();html+="<ol>";listType="ol"}
      html+=`<li>${inline(m[3])}</li>`;continue;
    }

    // 标题
    m=line.match(/^(#{1,4})\s+(.*)/);
    if(m){
      closeL();flushTable();
      const lvl=Math.min(parseInt(m[1].length),4);
      html+=`<h${lvl}>${inline(m[2])}</h${lvl}>`;continue;
    }

    // 普通段落
    closeL();
    html+=`<p>${inline(line)}</p>`;
  }
  closeL();closeQuote();flushTable();

  // Phase 4: inline 格式化（在块内执行）
  html=inlineFmt(html);

  // Phase 5: 还原代码块
  html=html.replace(/\x00CB(\d+)\x00/g,(_,idx)=>{
    const cb=codeBlocks[parseInt(idx)];
    if(!cb)return"";
    const langTag=cb.lang?` class="language-${esc(cb.lang)}"`:"";
    return `<pre><code${langTag}>${esc(cb.code)}</code></pre>`;
  });

  return html;

  // inline 格式化：粗体 > 斜体 > 删除线 > 行内代码 > 链接
  function inlineFmt(html){
    html=html
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g,"<em>$1</em>")
      .replace(/~~([^~]+)~~/g,"<del>$1</del>")
      .replace(/`([^`\n]+)`/g,"<code>$1</code>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return html;
  }
  function inline(x){return inlineFmt(x)}
}

function addStep(w,ev){

      ${has?`<b>Action</b><pre>${esc(JSON.stringify(ev.tool_call,null,2))}</pre>`:""}

function setStream(on){

  isStreaming=on;

  sendB.classList.toggle("stop",on);

  sendB.disabled=!on&&!input.value.trim();

  $("sIcon").innerHTML=on

    ?'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>'

    :'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>';

  sendB.setAttribute("aria-label",on?"停止":"发送");

}

async function send(){

  const text=input.value.trim();

  if(!text||isStreaming)return;

  if(text.length>4096){toast("消息超过长度上限","err");return}

  input.value="";autosize();updCnt();

  addMsg("u",text);

  reviveStaleTraces();
  pending=[];setStream(true);stick=true;

  ctrl=new AbortController();

  const tid=setTimeout(()=>ctrl&&ctrl.abort(),120000);



  // 单气泡生命周期：打字占位 → 流式增量 → 最终回答

  let tr=null,b=null;

  let full="",paintTimer=null;

  const paint=(cursor)=>{try{b.innerHTML=md(full)+(cursor?'<span class="cur"></span>':"")}catch(e){b.textContent=full}};



  tr=createTrace();
  ({b}=addMsg("a",'<span class="cur"></span>',{html:true}));

  try{

    const resp=await fetch("/api/chat",{method:"POST",

      headers:xuid({"Content-Type":"application/json"}),

      body:JSON.stringify({message:text,session_id:sessionId,user_id:uid,stream:true}),

      signal:ctrl.signal});

    if(!resp.ok){

      let d="HTTP "+resp.status;

      try{const j=await resp.json();if(j.detail)d=j.detail}catch(e){}

      throw Object.assign(new Error(d),{status:resp.status});

    }

    const rd=resp.body.getReader(),dec=new TextDecoder();let buf="";

    for(;;){

      const r=await rd.read();if(r.done)break;

      buf+=dec.decode(r.value,{stream:true});

      const ls=buf.split("\n");buf=ls.pop()||"";

      for(const ln of ls){

        if(!ln.startsWith("data: "))continue;

        const pl=ln.slice(6).trim();

        if(pl==="[DONE]")continue;

        let ev=null;

        try{ev=JSON.parse(pl)}catch(e){continue}

        switch(ev.type){

          case "meta":

            sessionId=ev.session_id;localStorage.setItem("h_sid",sessionId);hint();break;

          case "delta":

            full+=(ev.content||"");

            if(!paintTimer){paint(true);down();paintTimer=setTimeout(()=>{paintTimer=null},80)}
            break;

          case "delta_reset":

            full="";
            b.innerHTML=(ev.reason==="retry"?'<div style="color:var(--tx3);font-size:11.5px;padding:4px 0">⏳ 重新组织回答…</div>':ev.reason==="forced_retrieval"?'<div style="color:var(--tx3);font-size:11.5px;padding:4px 0">🔍 正在检索商品…</div>':"")+'<span class="cur"></span>';
            break;

          case "answer_replace":

            full=ev.content||"";paint(false);down();break;

          case "step":

            pending.push(ev);

            // final 步是答案轮的轨迹记录，答案已在气泡中，不再折叠
            if(!ev.final){
              if(full.trim()){
                b.innerHTML='<div style="color:var(--tx3);font-size:11.5px;padding:4px 0">▸ '+esc(full.slice(0,80))+(full.length>80?"…":"")+'</div>';
              } else {
                b.innerHTML='<span class="cur"></span>';
              }
              full="";   // 新一轮从空开始，防止旧规划文本混入下轮渲染
            }
            addStep(tr,ev);

            break;

          case "result":

            b.innerHTML=md(ev.answer||"(空)");

            metaLine(b,ev);

            stick=true;down();break;

          case "error":

            b.innerHTML=md("⚠️ "+(ev.message||"处理失败"));

            toast(ev.message||"处理失败","err");break;

        }

      }

    }

    // 流结束兜底：未收到 result 事件时做最终 Markdown 渲染并移除光标
    if(full.trim()&&!b.querySelector(".meta")){b.innerHTML=md(full)}

  }catch(err){
    endTrace(tr);
    if(err.name==="AbortError"){

      b.innerHTML=md(full?full+"\n\n⏹ 已停止生成":"⏹ 已停止生成");

    }else{

      const friendly=(err.status===403?"🔒 ":err.status===429?"⏳ ":"❌ ")+err.message;

      b.innerHTML=md(friendly);

      if(err.status!==403&&err.status!==429)toast("请求失败："+err.message,"err");

    }

  }finally{

    clearTimeout(tid);setStream(false);ctrl=null;if(paintTimer){clearTimeout(paintTimer);paintTimer=null;}

    if(tr)endTrace(tr);   // 双保险：任一路径都终止「推理中」

    loadSess();

  }

}

        <div class="sub">工具调用分布</div>

        ${cnt.length?cnt.map(([n,v])=>`<div class="bar"><div class="bl"><span>${esc(n)}</span><span>${v}</span></div><div class="bt"><div class="bf" style="width:${(v/mx*100).toFixed(1)}%"></div></div></div>`).join(""):'<p style="color:var(--tx3);font-size:12px">暂无调用</p>'}

        <div class="sub">最近推理轨迹</div>

        ${traces.map(t=>`<div class="trace-mini"><b>${esc(t.session_id||"-")}</b> · ${esc(((t.thought||"")||"").slice(0,44))}</div>`).join("") || '<p style="color:var(--tx3);font-size:12px">暂无记录</p>'}`;

    }

  }catch{b.innerHTML='<p style="color:var(--err);font-size:12.5px">加载失败</p>'}

}



/* ── 管理抽屉 ── */

let admTab="p",prodCache=[];
let prodPage=1,prodQ="",prodCat="",prodSt="",editingId=null;
const PROD_PAGE_SIZE=15;

function openAdmin(){

  $("drawer").classList.add("open");$("mask").classList.add("show");

  $("dT").textContent="运营管理";

  $("dB").innerHTML=`

    <input class="fld" id="admTk" placeholder="管理员 Token（默认 demo-admin-token）"

      value="${esc(localStorage.getItem("h_adm_tk")||"demo-admin-token")}"/>

    <p class="note">与后端 ADMIN_TOKEN 一致；输入后自动生效并刷新列表</p>

    <div class="tabs"><button class="tab on" data-t="p">商品库</button><button class="tab" data-t="a">售后审核</button></div>

    <div id="tabP"></div><div id="tabA" style="display:none"></div>`;

  const applyTk=()=>{localStorage.setItem("h_adm_tk",$("admTk").value.trim());loadProd();loadAfter()};

  $("admTk").addEventListener("change",applyTk);

  $("admTk").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyTk()}});

  $("dB").querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{

    admTab=t.dataset.t;

    $("dB").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));

    $("tabP").style.display=admTab==="p"?"block":"none";

    $("tabA").style.display=admTab==="a"?"block":"none";

  }));

  loadProd();loadAfter();

}

async function loadProd(){
  const el=$("tabP");if(!el)return;
  try{
    const r=await fetch("/api/admin/products",{headers:{"X-Admin-Token":admTk()}});
    if(r.status===403){el.innerHTML='<p style="color:var(--err);font-size:12px">Token 错误</p>';return}
    if(r.status===429){el.innerHTML='<p style="color:var(--err);font-size:12px">请求过于频繁，稍后再试</p>';return}
    const d=await r.json();prodCache=d.products||[];

    // 类别下拉选项（首次构建后保持选择）
    const cats=[...new Set(prodCache.map(p=>p.category))].sort();

    el.innerHTML=`
      <div class="row2" style="margin-bottom:7px">
        <input class="fld" id="pq" placeholder="搜索名称/编号…" style="margin:0" value="${esc(prodQ)}"/>
        <select class="fld" id="pcat" style="margin:0"><option value="">全部类别</option>
          ${cats.map(c=>`<option ${c===prodCat?"selected":""}>${esc(c)}</option>`).join("")}</select>
      </div>
      <div class="row2" style="margin-bottom:9px">
        <select class="fld" id="pst" style="margin:0">
          <option value="">全部状态</option>
          <option ${prodSt==="在售"?"selected":""}>在售</option>
          <option ${prodSt==="下架"?"selected":""}>下架</option></select>
        <button class="abtn" id="rei" style="flex-shrink:0">重建向量索引</button>
      </div>
      <div id="plist"></div>
      <div id="ppg" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:12px;color:var(--tx2)"></div>
      <details style="margin-top:12px"><summary class="abtn pri" style="display:block;text-align:center">＋ 新增商品</summary>
      <div style="margin-top:8px">
        <input class="fld" id="npN" placeholder="名称 *"/><input class="fld" id="npC" placeholder="品类 *"/>
        <div class="row2"><input class="fld" id="npB" placeholder="品牌"/><input class="fld" id="npPr" placeholder="价格 *" type="number"/></div>
        <input class="fld" id="npD" placeholder="描述"/><input class="fld" id="npT" placeholder="标签，逗号分隔"/>
        <input class="fld" id="npS" type="number" min="0" value="100" placeholder="库存数量"/>
        <button class="abtn pri" id="npGo" style="width:100%">提交上架（同步向量库）</button></div></details>`;

    $("pq").addEventListener("input",e=>{prodQ=e.target.value.trim();prodPage=1;renderList()});
    $("pcat").addEventListener("change",e=>{prodCat=e.target.value;prodPage=1;renderList()});
    $("pst").addEventListener("change",e=>{prodSt=e.target.value;prodPage=1;renderList()});
    $("rei").addEventListener("click",async()=>{
      toast("重建中…");
      const rr=await fetch("/api/admin/products/reindex",{method:"POST",headers:admH()});
      rr.ok?(toast("向量索引已重建 ✓","ok")):toast("重建失败","err");
    });
    const go=el.querySelector("#npGo");
    go.addEventListener("click",async()=>{
      const body={name:$("npN").value.trim(),category:$("npC").value.trim(),
        brand:$("npB").value.trim(),price:parseFloat($("npPr").value)||-1,
        description:$("npD").value.trim(),
        tags:$("npT").value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),
        specs:{},stock:parseInt($("npS").value)||100,status:"在售"};
      if(!body.name||!body.category||body.price<0){toast("名称/品类/价格为必填","err");return}
      const r=await fetch("/api/admin/products",{method:"POST",headers:admH({"Content-Type":"application/json"}),body:JSON.stringify(body)});
      r.ok?(toast("已上架并同步向量库 ✓","ok"),loadProd()):toast("创建失败 HTTP "+r.status,"err");
    });

    renderList();
  }catch{el.innerHTML='<p style="color:var(--err);font-size:12px">加载失败</p>'}

  function renderList(){
    const listEl=$("plist");if(!listEl)return;
    let rows=prodCache;
    if(prodQ){
      const q=prodQ.toLowerCase();
      rows=rows.filter(p=>p.name.toLowerCase().includes(q)||p.id.includes(q));
    }
    if(prodCat)rows=rows.filter(p=>p.category===prodCat);
    if(prodSt)rows=rows.filter(p=>p.status===prodSt);

    const pages=Math.max(1,Math.ceil(rows.length/PROD_PAGE_SIZE));
    if(prodPage>pages)prodPage=pages;
    const slice=rows.slice((prodPage-1)*PROD_PAGE_SIZE,prodPage*PROD_PAGE_SIZE);

    listEl.innerHTML=slice.length?slice.map(p=>{
      if(p.id===editingId){
        return `<div class="card" style="border-color:var(--tx3)">
          <input class="fld" id="edN" value="${esc(p.name)}"/>
          <div class="row2"><input class="fld" id="edC" value="${esc(p.category)}"/>
          <input class="fld" id="edB" value="${esc(p.brand||"")}"/></div>
          <div class="row2"><input class="fld" id="edPr" type="number" value="${p.price}"/>
          <select class="fld" id="edSt"><option ${p.status==="在售"?"selected":""}>在售</option><option ${p.status==="下架"?"selected":""}>下架</option></select></div>
          <input class="fld" id="edS" type="number" min="0" value="${p.stock??0}" placeholder="库存数量"/>
        <input class="fld" id="edD" value="${esc(p.description||"")}"/>
          <input class="fld" id="edT" value="${esc((p.tags||[]).join(","))}"/>
          <div class="row2"><button class="abtn pri" id="edSave">保存</button><button class="abtn" id="edCancel">取消</button></div></div>`;
      }
      return `<div class="card prow" style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;min-width:0"><b>${esc(p.name)}</b><span class="pill">${esc(p.status)}</span><span class="pill" style="${p.stock===0?"color:var(--err)":p.stock<=5?"color:var(--warn,#fbbf24)":""}">${p.stock===0?"售罄":"库存 "+p.stock}</span>
        <p>¥${p.price} · ${esc(p.category)} · ${esc(p.brand||"")} · ${esc(p.id)}</p></div>
        <button class="abtn ed" data-id="${esc(p.id)}">编辑</button>
        <button class="abtn tog" data-id="${esc(p.id)}">${p.status==="在售"?"下架":"上架"}</button>
        <button class="abtn warn dd" data-id="${esc(p.id)}">删</button></div>`;
    }).join(""):'<p style="color:var(--tx3);font-size:12px">无匹配商品</p>';

    // 分页控件
    const pg=$("ppg");
    pg.innerHTML=`<button class="abtn" id="pv" ${prodPage<=1?"disabled":""}>上一页</button>
      <span>${prodPage} / ${pages} 页 · 共 ${rows.length}</span>
      <button class="abtn" id="nx" ${prodPage>=pages?"disabled":""}>下一页</button>`;
    $("pv").addEventListener("click",()=>{prodPage--;renderList()});
    $("nx").addEventListener("click",()=>{prodPage++;renderList()});

    // 行操作绑定
    listEl.querySelectorAll(".tog").forEach(b=>b.addEventListener("click",()=>{
      const p=rows.find(x=>x.id===b.dataset.id)||prodCache.find(x=>x.id===b.dataset.id);
      if(p)toggleProd(p,p.status==="在售"?"下架":"在售");
    }));
    listEl.querySelectorAll(".dd").forEach(b=>b.addEventListener("click",()=>{
      if(confirm("确定删除该商品（含向量索引）？"))delProd(b.dataset.id);
    }));
    listEl.querySelectorAll(".ed").forEach(b=>b.addEventListener("click",()=>{
      editingId=b.dataset.id;prodPage=Math.ceil(rows.findIndex(x=>x.id===editingId)/PROD_PAGE_SIZE+0.001)||prodPage;renderList();
      const card=listEl.querySelector('.card[style*="border-color"]');card&&card.scrollIntoView({block:"center"});
    }));
    const sv=listEl.querySelector("#edSave");
    if(sv)sv.addEventListener("click",async()=>{
      const body={
        name:$("edN").value.trim(),category:$("edC").value.trim(),brand:$("edB").value.trim(),
        price:parseFloat($("edPr").value),status:$("edSt").value,
        description:$("edD").value.trim(),
        tags:$("edT").value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),
        specs:{},stock:parseInt($("edS").value)||0};
      if(!body.name||!body.category||isNaN(body.price)){toast("名称/品类/价格必填","err");return}
      const r=await fetch("/api/admin/products/"+encodeURIComponent(editingId),{
        method:"PUT",headers:admH({"Content-Type":"application/json"}),body:JSON.stringify(body)});
      r.ok?(toast("已保存并同步向量库 ✓","ok"),editingId=null,loadProd()):toast("保存失败 HTTP "+r.status,"err");
    });
    const cc=listEl.querySelector("#edCancel");
    if(cc)cc.addEventListener("click",()=>{editingId=null;renderList()});
  }
}
async function toggleProd(p,to){

  const r=await fetch("/api/admin/products/"+encodeURIComponent(p.id),{method:"PUT",

    headers:admH({"Content-Type":"application/json"}),

    body:JSON.stringify({name:p.name,category:p.category,brand:p.brand||"",price:p.price,

      description:p.description||"",specs:p.specs||{},tags:p.tags||[],status:to})});

  r.ok?(toast(to==="在售"?"已上架":"已下架","ok"),loadProd()):toast("失败","err");

}

async function delProd(id){

  const r=await fetch("/api/admin/products/"+encodeURIComponent(id),{method:"DELETE",headers:{"X-Admin-Token":admTk()}});

  r.ok?(toast("已删除（含向量索引）","ok"),loadProd()):toast("失败","err");

}

let asStatus="";

async function loadAfter(){

  const el=$("tabA");if(!el)return;

  el.innerHTML=`<select class="fld" id="asSt">

      ${["","待审核","已通过","已完成","已拒绝"].map(s=>`<option value="${s}" ${s===asStatus?"selected":""}>${s||"全部状态"}</option>`).join("")}</select>

    <div id="asRows"><p style="color:var(--tx3);font-size:12px">加载中…</p></div>`;

  $("asSt").addEventListener("change",()=>{asStatus=$("asSt").value;loadAfter()});

  const rowsEl=$("asRows");

  try{

    const r=await fetch("/api/admin/aftersales"+(asStatus?"?status="+encodeURIComponent(asStatus):""),{headers:{"X-Admin-Token":admTk()}});

    if(r.status===403){rowsEl.innerHTML='<p style="color:var(--err);font-size:12px">Token 错误</p>';return}

    const d=await r.json();const rows=d.aftersales||[];

    rowsEl.innerHTML=rows.map(a=>`

      <div class="card"><b>${esc(a.as_id)}</b><span class="pill">${esc(a.status)}</span>

      <p>${esc(a.type)} · 订单 ${esc(a.order_id)} · 退 ${a.qty||"-"} 件${a.refund_amount?` · 退款 ¥${Number(a.refund_amount).toFixed(2)}`:""}</p>

      <p style="color:var(--tx3)">原因：${esc(a.reason||"-")}</p>

      ${a.status==="待审核"?`<div class="row2" style="margin-top:7px"><button class="abtn ap" data-id="${esc(a.as_id)}">通过</button><button class="abtn warn rj" data-id="${esc(a.as_id)}">驳回</button></div>`:""}

      ${a.status==="已通过"?`<button class="abtn fin" data-id="${esc(a.as_id)}">完成打款</button>`:""}</div>`).join("")

      ||'<p style="color:var(--tx3);font-size:12px">暂无售后单</p>';

    rowsEl.querySelectorAll(".ap").forEach(b=>b.addEventListener("click",()=>review(b.dataset.id,"approve")));

    rowsEl.querySelectorAll(".rj").forEach(b=>b.addEventListener("click",()=>{

      const rs=prompt("驳回原因（必填）：");if(rs&&rs.trim())review(b.dataset.id,"reject",rs.trim());

    }));

    rowsEl.querySelectorAll(".fin").forEach(b=>b.addEventListener("click",()=>review(b.dataset.id,"complete")));

  }catch{rowsEl.innerHTML='<p style="color:var(--err);font-size:12px">加载失败</p>'}

}

async function review(id,action,note=""){

  const r=await fetch(`/api/admin/aftersales/${encodeURIComponent(id)}/${action}`,{

    method:"POST",headers:admH({"Content-Type":"application/json"}),body:JSON.stringify({note})});

  if(r.ok){toast(`已${action==="approve"?"通过":action==="reject"?"驳回":"完成打款"}`,"ok");loadAfter()}

  else{const d=await r.json().catch(()=>({}));toast(d.detail||"操作失败","err")}

}



/* ── 健康 ── */

async function healthPoll(){

  try{

    const r=await fetch("/health",{cache:"no-store"});

    const h=r.ok?await r.json():{};

    const ok=r.ok&&h.status==="ok";

    $("dot").classList.toggle("on",ok);

    $("stxt").textContent=ok?"正常":"异常";

    if(h.model)$("badge").textContent=h.model;

    if(h.version)$("ver2").textContent=h.version;

  }catch{$("dot").classList.remove("on");$("stxt").textContent="离线";}

}



/* ── 输入 ── */

function autosize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"}

function updCnt(){const n=input.value.length;$("cnt").textContent=n?n+"/4096":"";if(!isStreaming)sendB.disabled=!n}

function hint(){$("hint").textContent=sessionId?"会话 "+sessionId:"新对话"}



input.addEventListener("input",()=>{autosize();updCnt()});

input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});

sendB.addEventListener("click",()=>{isStreaming?ctrl&&ctrl.abort():send()});

$("newBtn").addEventListener("click",()=>{

  if(isStreaming){toast("请等待当前回答完成","err");return}

  localStorage.removeItem("h_sid");sessionId=null;resetUI(true);hint();loadSess();

});

$("menuBtn").addEventListener("click",()=>$("side").classList.toggle("openm"));

$("mBtn").addEventListener("click",()=>openD("metrics","运行指标"));

$("tBtn").addEventListener("click",()=>openD("tools","工具清单"));

$("aBtn").addEventListener("click",openAdmin);

$("dClose").addEventListener("click",closeD);

$("mask").addEventListener("click",closeD);



/* ── 主题 ── */

/* ── 主题：黑白切换（静态按钮） ── */

function applyTheme(t){

  document.documentElement.setAttribute("data-theme",t);

  localStorage.setItem("h_theme",t);

}

function toggleTheme(){

  applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");

}

$("themeBtn").addEventListener("click",toggleTheme);

applyTheme(localStorage.getItem("h_theme")||

  (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));



/* ── 启动 ── */

(async function boot(){

  hint();healthPoll();setInterval(healthPoll,15000);loadSess();

  resetUI(true);

  input.focus();

})();

</script>
